[project]
name = "mpi"
version = "0.1.0"
description = "Personalização Inteligente de Materiais Didáticos com LLMs e o Modelo Felder-Silverman — API, Worker e Pipeline (PIBIC/UFMA)."
requires-python = ">=3.13"
readme = "README.md"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "asyncpg>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
]

# Ruff cobre lint + format num único binário, evitando empilhar flake8/isort/black.
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
# legado fora do padrão de lint novo até ser substituído (Documento 5, Seção 15)
extend-exclude = ["modulos", "main.py", "limpar_latex.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["core", "domain", "application", "infrastructure", "presentation", "shared"]

# Depends(...)/Query(...) como valor default são o padrão de DI do próprio FastAPI
# (Documento 4, §7) — sem isso o B008 trata Depends como uma chamada mutável comum.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends"]

# mypy: mais maduro que as alternativas para SQLAlchemy 2.0 (Mapped[]) e Pydantic v2.
[tool.mypy]
python_version = "3.13"
mypy_path = "src"
explicit_package_bases = true
exclude = ["^modulos/", "^main\\.py$", "^limpar_latex\\.py$"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# pythonpath em src/ permite `from core import ...` sem instalar o projeto como pacote.
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

# aplicação, não biblioteca — uv só gerencia dependências, sem etapa de build/publish
[tool.uv]
package = false
